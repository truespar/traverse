[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
# PyPI distribution name. The bare `traverse` name is taken by an
# unrelated project, so the embedded binding publishes as
# `traverse-embedded` (matching the .NET `Traverse.Embedded` naming).
# The import name stays `traverse` - see [tool.maturin] module-name.
name = "traverse-embedded"
version = "0.9.1"
description = "Embedded Traverse graph database for Python (in-process, native PyO3 bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://truespar.com/traverse/docs"
Documentation = "https://truespar.com/traverse/docs"
Source = "https://github.com/truespar/traverse"
Issues = "https://github.com/truespar/traverse/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
module-name = "traverse"
