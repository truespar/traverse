# cargo-fuzz infrastructure for `traverse-gql`.
#
# Run any target with the nightly toolchain - libFuzzer requires
# the sanitizer instrumentation passes only available in nightly:
#
#   rustup install nightly
#   cargo +nightly fuzz run parse --max-total-time 600
#   cargo +nightly fuzz run lower --max-total-time 600
#
# The runtime cap is recommended for CI integration. Locally,
# omit `--max-total-time` to fuzz indefinitely until you press
# Ctrl-C.
#
# When a crash is found, the input that triggered it is saved
# under `fuzz/artifacts/<target>/` and the inverse of the
# minimal reproducer goes to `fuzz/corpus/<target>/`. Both are
# git-ignored - re-run with the artifact path appended to verify
# a fix:
#
#   cargo +nightly fuzz run parse fuzz/artifacts/parse/crash-<hash>

[package]
name = "traverse-gql-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
traverse-gql = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower"
path = "fuzz_targets/lower.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip_integer"
path = "fuzz_targets/roundtrip_integer.rs"
test = false
doc = false
bench = false
