[package]
name = "traverse-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C FFI layer for Traverse embedded graph database"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
traverse-core = { path = "../traverse-core" }
traverse-cypher = { path = "../traverse-cypher" }
# ISO/IEC 39075 GQL front-end for traverse_query_gql.
traverse-gql = { path = "../traverse-gql" }
# local-dynamic TLS: with mimalloc's default (initial-exec) loading this library with dlopen fails
# on Linux with "cannot allocate memory in static TLS block".
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
